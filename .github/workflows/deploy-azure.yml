name: CD - Deploy to Azure App Service

# ASP.NET Framework 4.8 ne peut PAS etre heberge sur GitHub Pages (statique uniquement).
# Ce workflow deploie le site sur Azure App Service (Windows).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "aspnet-get-started/**"
      - ".github/workflows/deploy-azure.yml"

env:
  CONFIGURATION: Release

jobs:
  build:
    name: Build & publish web app
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore aspnet-get-started.sln

      - name: Publish web application
        run: >
          msbuild aspnet-get-started\aspnet-get-started.csproj
          /p:Configuration=${{ env.CONFIGURATION }}
          /p:Platform="AnyCPU"
          /p:DeployOnBuild=true
          /p:DeployDefaultTarget=WebPublish
          /p:WebPublishMethod=FileSystem
          /p:DeleteExistingFiles=True
          /p:PublishUrl=${{ github.workspace }}\published-site

      - name: Zip package
        shell: pwsh
        run: Compress-Archive -Path "${{ github.workspace }}\published-site\*" -DestinationPath "${{ github.workspace }}\app.zip" -Force

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: azure-webapp-package
          path: app.zip
          retention-days: 7

  deploy:
    name: Deploy to Azure
    needs: build
    runs-on: windows-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.webapp-url }}
    steps:
      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: azure-webapp-package

      - name: Deploy to Azure Web App
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: app.zip
